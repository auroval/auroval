# A nested Hyprland, so `auroval-lock rehearse` locks something that is not
# the session you are sitting in. Everything here is off: the measurement is
# of this project's present path, and a compositor animating its own windows
# underneath would be in the number.
monitor=WAYLAND-1,preferred,0x0,1
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}
animations { enabled = false }
decoration { blur { enabled = false } }
