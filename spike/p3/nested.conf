# A nested Hyprland, so `auroval-lock rehearse` locks something that is not
# the session you are sitting in.
#
# This matters more since 2026-11-09 than it did when the file was written.
# The skeleton released its lock on Esc and on the AUROVAL_LOCK_SECONDS
# timer; L9 took both away in the commit that introduced PAM, so a rehearsal
# now ends with the compositor still locked and **you close this window**.
# There is no key. On the session you are sitting in there would be no way
# back but the right password, or killing the compositor from another VT and
# losing everything unsaved. Everything here is off: the measurement is
# of this project's present path, and a compositor animating its own windows
# underneath would be in the number.
monitor=WAYLAND-1,preferred,0x0,1
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}
animations { enabled = false }
decoration { blur { enabled = false } }
