[package]
name = "greet"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "auroval's login screen: a greetd greeter with the desktop's own look."

[[bin]]
name = "auroval-greet"
path = "src/main.rs"

[dependencies]
greetd-proto = { path = "../greetd-proto" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.16"
fontdue = "0.9"
# Local time, for the clock and the date line (R11). default-features off
# keeps it to the `clock` feature: the greeter needs the wall clock and
# nothing else chrono can do. MIT OR Apache-2.0, like the rest of the graph.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Q4: Lua in a restricted interpreter. `vendored` builds Lua 5.4 from source so
# the sandbox is not at the mercy of whatever liblua the host happens to ship.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
