[package]
name = "greet"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "auroval's login screen: a greetd greeter with the desktop's own look."

[[bin]]
name = "auroval-greet"
path = "src/main.rs"

[dependencies]
# Everything this binary draws with. The split is described in that crate's
# own doc comment; what is left here is the greetd half and nothing else.
auroval-ui = { path = "../auroval-ui" }
greetd-proto = { path = "../greetd-proto" }
# The surfaces and the seat. `greet` is an `xdg_shell` toplevel under `cage`;
# the locker is `ext-session-lock`, which is why this dependency did not move
# into the library with the renderer.
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# The clock, for the one call that formats the time on each turn of the loop.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "unstable-locales",
] }
# `snapshot` writes the read-back pixels to a PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
