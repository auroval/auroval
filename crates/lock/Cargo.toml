[package]
name = "lock"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "auroval's lock screen, protocol skeleton only: no authentication of any kind."

[[bin]]
name = "auroval-lock"
path = "src/main.rs"

[dependencies]
# The boundary this list used to mark has moved, and the move is the point of
# reading it. It said: "no PAM crate, no password handling, no `libc` for a
# conversation function." PAM is now here, so `libc` is too -- for `calloc`
# and `free`, because `pam_conv(3)` requires the response array be heap
# memory that PAM itself releases.
#
# What is still absent, and still checkable here: there is no PAM *crate*.
# `src/pam.rs` is four functions and three structs transcribed from
# `pam_conv(3)` and `/usr/include/security/_pam_types.h`, for the reason
# `crates/greetd-proto` exists -- auroval owns the code on the paths it
# cannot afford to be wrong about. `pam-sys` and `pam-client2` were both
# considered and the file says why neither is here.
libc = "0.2"
auroval-ui = { path = "../auroval-ui" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "unstable-locales",
] }
