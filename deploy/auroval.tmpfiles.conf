# systemd-tmpfiles — installed as /etc/tmpfiles.d/auroval.conf.
#
# Two directories the greeter must own, created before anything starts them
# and recreated if they are ever lost. Both are outside any home directory,
# because the greeter runs as its own user and must still work when
# /home/<user> is mode 700 (C10).
#
# /var/lib/auroval is R4's memory: the last user and the last session. Without
# it `auroval-greet probe` reports
#
#     state file   /var/lib/auroval/last-login
#       writable     no — Permission denied (os error 13)
#
# which looks like a bug in the store and is not one — it is this file missing.
#
# /var/cache/auroval is C15's writable cache, worth ~0.9 s of every login.
# It is a cache in the FHS sense: safe to delete, rebuilt on the next start,
# and measurably expensive to be without. Nothing in it is state.
#
# The owner is greetd's `greeter` user, which the greetd package creates. If
# the greeter ever runs as a different user, change it in both lines or the
# greeter is back to having nowhere to write.

d /var/lib/auroval   0750 greeter greeter -
d /var/cache/auroval 0750 greeter greeter -

# Backgrounds, and anything else a theme asks the greeter to show.
#
# Separate from the two above, and owned by root rather than `greeter`, for
# two reasons. It is not state: the greeter reads it and never writes it, so
# nothing here needs the greeter's pen. And 0755 means the maintainer can see
# what is in it without root, which matters for a directory whose whole job is
# to hold the thing you are looking at -- `/var/lib/auroval` is 0750 because
# R4's last-login record lives there, and that is a worse neighbour for
# artwork than it first appears.
#
# C10 and R15 are satisfied by it being outside every home, which is the
# actual requirement; `background::RECOMMENDED_DIR` names /var/lib/auroval and
# this is a directory inside it, so the refusal message still points
# somewhere true.
#
# When themes become packages this may want to move: installed artwork is
# static data and arguably belongs under /usr/share, with /var/lib left for
# what varies. That is a decision for the theme work, not for a tmpfiles line.
d /var/lib/auroval/media 0755 root root -
