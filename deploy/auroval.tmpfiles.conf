# systemd-tmpfiles — installed as /etc/tmpfiles.d/auroval.conf.
#
# Two directories the greeter must own, created before anything starts them
# and recreated if they are ever lost. Both are outside any home directory,
# because the greeter runs as its own user and must still work when
# /home/<user> is mode 700 (C10).
#
# /var/lib/auroval is R4's memory: the last user and the last session. Without
# it `auroval-greet probe` reports
#
#     state file   /var/lib/auroval/last-login
#       writable     no — Permission denied (os error 13)
#
# which looks like a bug in the store and is not one — it is this file missing.
#
# /var/cache/auroval is C15's writable cache. Measured 2026-11-09: a greeter
# start with no registry here reaches first frame in 1874 ms, against R16's
# 500 ms budget; with one, 19 ms. deploy/install.nu warms it as `greeter` so
# the first login does not pay that.
# It is a cache in the FHS sense: safe to delete, rebuilt on the next start,
# and measurably expensive to be without. Nothing in it is state.
#
# The owner is greetd's `greeter` user, which the greetd package creates. If
# the greeter ever runs as a different user, change it in both lines or the
# greeter is back to having nowhere to write.

d /var/lib/auroval   0750 greeter greeter -
d /var/cache/auroval 0750 greeter greeter -

# Backgrounds, and anything else a theme asks the greeter to show.
#
# NOT under /var/lib/auroval, and that is the whole point of this comment.
# The first version of this put it there as `media/`, 0755, with a confident
# note about being able to see what is in it without root. That is false:
# /var/lib/auroval is 0750 greeter:greeter because R4's last-login record
# lives there, so nothing can traverse into a child of it except `greeter`
# and root, whatever mode the child carries. The preview mode, which runs as
# the maintainer, fell back to the solid colour and said only that an element
# failed to change its state.
#
# /usr/local/share is where locally installed architecture-independent data
# goes, and artwork is exactly that: the greeter reads it and never writes
# it, it does not vary, and it is not state. It is outside every home, which
# is what R15 and C10 actually require.
#
# When themes become packages their assets want /usr/share/auroval/themes/
# alongside this; /usr/local is for what you put there by hand.
d /usr/local/share/auroval 0755 root root -
