# auroval's greetd configuration — installed as /etc/greetd/auroval.toml.
#
# NOT /etc/greetd/config.toml. That file is greetd's default and the one the
# `greetd.service` unit reads unless a drop-in says otherwise, and this
# project does not touch it. The day you want plain `agreety` back, it is
# there and correct — which is the rollback deploy/TRIAL.md rests on.
#
# Nothing about this file enables greetd, and installing it changes no
# behaviour on its own. That is deliberate: the P0 spike learned the hard way
# that greetd is a daemon, not a one-shot — when a session ends it starts a
# FRESH greeter and switches the console back to its own VT. Run as a service
# before you are ready, it will keep yanking you off whatever you were doing.
#
# `vt` is 1, and that is the deployed value rather than a spike's.
# `greetd.service` carries `Conflicts=getty@tty1.service`, so the unit already
# takes tty1 away from its getty in order to put a login screen there; a
# config that then points somewhere else leaves tty1 with neither. The repo's
# spikes use VT 3 because they run alongside a display manager that owns 1,
# and they pass `--vt 3` for themselves — see spike/p1e/greetd-session.nu.
#
# This was 3 until 2026-11-09, and the day it mattered was the day somebody
# ran `deploy/install.nu` without `--vt 1`: the file on disk said 3 while the
# running greetd, started before that install, was still on 1. Nothing
# compared them. install.nu does now.

[terminal]
vt = 1

[default_session]
# deploy/auroval-greet.sh, installed. It sets the C15 cache variables and
# execs cage; see that file for why it is /bin/sh and why it exists at all.
command = "/usr/local/lib/auroval/auroval-greet.sh"
user = "greeter"
