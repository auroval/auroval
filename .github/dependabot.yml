version: 2
updates:
  # Rust dependencies. Grouped so a week of patch bumps is one pull request
  # rather than nine: tenet 4 means review time is the scarce resource here.
  #
  # Three things learned the hard way, the third of them twice:
  #
  # 1. The gstreamer crates must move in lockstep. Ungrouped, Dependabot
  #    opened separate PRs for `gstreamer-app`, `gstreamer-video` and
  #    `gstreamer`, which put two incompatible versions of the `gstreamer`
  #    crate in one graph — `gstreamer_app::gstreamer::FlowError` and
  #    `gstreamer::FlowError` became different types and nothing compiled.
  #    None of those PRs could have passed alone.
  #
  # 2. For a 0.x crate, Dependabot's "minor" is a breaking change. Grouping
  #    minor bumps as routine meant 0.24 -> 0.25 arrived looking like
  #    housekeeping. The catch-all group is therefore patch-only, so a
  #    breaking 0.x bump shows up as its own PR and gets read.
  #
  # 3. Lesson 1 was encoded too narrowly. The group was named `gstreamer` and
  #    matched only `["gstreamer", "gstreamer-*"]`, and the second run broke
  #    through it on 2026-11-09:
  #
  #      #71  "in the gstreamer group"   bumped `gstreamer` and nothing else
  #      #69                             bumped `gstreamer-gl` alone
  #      #70                             bumped `gstreamer-gl-egl` alone
  #      #73                             bumped `glib` alone
  #
  #    Each of the four put `glib 0.22` *beside* `glib 0.21` in the lock file
  #    and failed with the same two dozen trait errors — `IsA<Element> is not
  #    implemented for AppSink`, `no method named set_gl_display`. Bumped
  #    together the whole stack compiles with no source change at all: clippy
  #    clean, 84 tests green, zero lines of Rust touched. So every one of
  #    those errors was the split, not the 0.25 API.
  #
  #    `glib` is the half that can be named with certainty: it is a direct
  #    dependency, gstreamer 0.25 requires 0.22, and it matched no pattern, so
  #    even a group holding every gstreamer crate would still have split it
  #    off. Why the gstreamer crates also went their own way is not visible
  #    from the pull requests themselves. The patterns below are now wide
  #    enough that it cannot matter; if a split happens again, the Dependabot
  #    run logs are the place to look.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      glib-stack:
        applies-to: version-updates
        patterns: ["gstreamer*", "glib*", "gio*", "gobject*"]
        update-types: ["major", "minor", "patch"]
      patch:
        applies-to: version-updates
        update-types: ["patch"]
    commit-message:
      prefix: "deps"

  # Action versions, which are also a supply-chain surface: a mutable tag on a
  # third-party action is arbitrary code in a workflow that can publish.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
