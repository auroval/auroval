name: Rust build dependencies
description: >-
  Installs the system packages declared in .devcontainer/system-deps.txt, the
  single list the devcontainer image also builds from.
runs:
  using: composite
  steps:
    # The package names are not written here. They live in
    # .devcontainer/system-deps.txt, which the devcontainer's Dockerfile also
    # installs, so the runner and the container cannot drift apart -- the whole
    # point of having a container. Each package's reason is in that file.
    #
    # The list sits under .devcontainer/ because that directory is the Docker
    # build context and `COPY` cannot reach outside it; see the header of
    # system-deps.txt. Reaching down into it from here is the cheaper half of
    # that trade.
    #
    # $GITHUB_WORKSPACE rather than a relative path, so this does not depend on
    # whatever working directory a caller happens to be in. $packages is
    # deliberately unquoted: apt wants the names as separate arguments.
    - shell: bash
      run: |
        set -euo pipefail
        list="$GITHUB_WORKSPACE/.devcontainer/system-deps.txt"
        test -f "$list" || { echo "::error::missing $list"; exit 1; }
        packages="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$list")"
        # An empty list would make `apt-get install` succeed having installed
        # nothing, and that would surface much later as three failing render
        # tests rather than as a broken list. Fail here instead.
        test -n "$packages" || { echo "::error::$list parsed to no packages"; exit 1; }
        echo "installing: $packages"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends $packages
