name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that is pushed to twice should not run twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filtering lives here rather than on the `on:` trigger, because a
  # required status check that never runs blocks a merge forever. Every job
  # below is always scheduled; the filter decides whether it does any work,
  # and `ci` at the bottom aggregates into one stable required check.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      python: ${{ steps.filter.outputs.python }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              # The system package list, which the composite action installs.
              # It lives under .devcontainer/ only because that is the Docker
              # build context, so it would otherwise reach just the
              # devcontainer job -- and a wrong list shows up as failing
              # render tests in `test`, which is the job that has to rerun.
              - '.devcontainer/system-deps.txt'
            docs:
              - '**/*.md'
              - '.github/scripts/check-doc-links.py'
            python:
              - 'tools/**'
              - '.github/scripts/**'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'
            devcontainer:
              - '.devcontainer/**'

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-deps
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-deps
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The greetd codec is pure logic and fully testable here. The spike is
      # only built: its measurements need a GPU and greetd's own user, so a
      # green CI run deliberately claims nothing about hardware decode.
      #
      # The render tests do run here, on llvmpipe. They assert pixels, so the
      # rasteriser has to be the same one every time: these three variables
      # pin it to software surfaceless EGL rather than leaving Mesa to pick
      # whatever the runner image happens to offer.
      - run: cargo test --workspace --all-targets
        env:
          EGL_PLATFORM: surfaceless
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: cargo build --workspace --all-targets

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The documents cross-reference each other heavily and are the whole
      # state of the project, so a broken relative link is a real defect.
      - run: python3 .github/scripts/check-doc-links.py

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # ffmpeg so the smoke test can exercise the ffprobe branch; a stills-only
      # test never touches it, and that is where a silent break hides.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # ruff is PINNED on purpose. Its default rule set is large (421 rules at
      # 0.17.4) and grows with releases, so an unpinned `pip install ruff` means
      # CI starts failing on main whenever ruff ships a new rule — on somebody
      # else's schedule, with no change here. Dependabot can raise it.
      - run: pip install ruff==0.17.4 -r tools/scene-check/requirements.txt
      - run: ruff check tools .github/scripts
      - run: ruff format --check tools .github/scripts
      # scene-check measures scene candidates and its numbers feed decisions in
      # docs/themes/nightshade.md, so it is covered rather than treated as a
      # scratch script. Two tests, deliberately not overlapping:
      #
      #   --self-test  the tool's own behavioural test, and the better one: it
      #                asserts the measurements, including that a bright patch
      #                behind a UI element is caught even when the composition
      #                clause passes. Stills only, by design.
      #   smoke-...py  what --self-test cannot reach: the --json key contract
      #                that the theme documents quote, the internal hue
      #                fallback that fires when matugen is absent (which is
      #                CI's path), and the ffprobe branch a still never touches.
      #
      # --matugen-assertions is deliberately NOT run: it guards against
      # matugen's behaviour changing on the maintainer's machine, which CI
      # cannot observe, and matugen is not installed here.
      - run: python tools/scene-check/scene_check.py --self-test
      - run: python .github/scripts/smoke-scene-check.py

  devcontainer:
    name: devcontainer builds
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f .devcontainer/Dockerfile .devcontainer

  # One required status check. It passes when nothing relevant changed and when
  # everything relevant passed, and fails if any job that ran did not.
  ci:
    name: CI
    if: always()
    needs: [changes, fmt, clippy, test, docs, python, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          FMT: ${{ needs.fmt.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
          PYTHON: ${{ needs.python.result }}
          DEVCONTAINER: ${{ needs.devcontainer.result }}
        run: |
          set -eu
          status=0
          check() {
            echo "$1: $2"
            case "$2" in
              success|skipped) ;;
              *) echo "::error::job '$1' reported '$2'"; status=1 ;;
            esac
          }
          check changes "$CHANGES"
          check fmt "$FMT"
          check clippy "$CLIPPY"
          check test "$TEST"
          check docs "$DOCS"
          check python "$PYTHON"
          check devcontainer "$DEVCONTAINER"
          exit $status
